[workspace]
resolver = "2"
members = [
    "rust/mmj-core",
    "rust/mmj-ai",
    "rust/mmj-nn",
    "rust/mmj-selfplay",
    "rust/mmj-serve",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
mmj-core = { path = "rust/mmj-core" }
mmj-ai = { path = "rust/mmj-ai" }
mmj-nn = { path = "rust/mmj-nn" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"

# The training/self-play hot path benefits from full optimization even in
# `cargo test`, otherwise shanten tests appear far slower than reality.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
