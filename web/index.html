<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mmoyager 日本麻将</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">mmoyager <span>日本麻将</span></div>
    <div id="round-info">
      <span id="round-name">东1局</span>
      <span id="honba">0 本场</span>
      <span id="sticks">供托 0</span>
      <span id="wall">余 0</span>
      <!-- Shown while the WebSocket is down: without it, every control silently
           does nothing and the page looks broken rather than disconnected. -->
      <span id="conn-chip" class="hidden">未连接</span>
    </div>
    <div class="controls">
      <label>场次
        <select id="sel-length">
          <option value="tonpuu">东风战</option>
          <option value="hanchan">半庄战</option>
        </select>
      </label>
      <label>座位
        <select id="sel-seat">
          <option value="0">起家（东）</option>
          <option value="1">南</option>
          <option value="2">西</option>
          <option value="3">北</option>
        </select>
      </label>
      <label>对手
        <select id="sel-bot">
          <option value="nn">神经网络 AI（已训练）</option>
          <option value="efficiency">牌效率 AI</option>
          <option value="random">随机 AI</option>
        </select>
      </label>
      <label>节奏
        <select id="sel-pace" title="每一张弃牌在牌河上出现的间隔">
          <option value="0">极慢</option>
          <option value="1">慢</option>
          <option value="2" selected>正常</option>
          <option value="3">快</option>
          <option value="4">极快</option>
        </select>
      </label>
      <!-- Every client that ships animation ships a switch: SEGA NET MJ has a
           演出モード toggle, しらぎく麻雀 an "effects off" option. Off means no
           motion, not a faster game — the pacing is the same. -->
      <label class="check" title="关掉所有动效（节奏不变）">
        <input type="checkbox" id="chk-anim" checked /> 动画
      </label>
      <button id="btn-new">新对局</button>
      <button id="btn-hint" title="让基线 AI 给出建议">提示</button>
      <button id="btn-replays" title="分析已保存的牌谱">牌谱分析</button>
      <a class="navlink" href="/dashboard" title="查看并控制后台训练">训练控制台</a>
    </div>
  </header>

  <main id="table">
    <!-- the seat opposite: name/wind/score, concealed hand, melds -->
    <section class="seat seat-across" id="seat-across"></section>

    <!-- The middle band is the table itself: three of the four discard ponds ring
         the centre panel, and the fourth (yours) sits at the bottom of the ring.
         Discards live here rather than in a list because that is how a real table
         reads: you see who is throwing what, at a glance.

         Each pond is laid out in its owner's own frame and then rotated into
         place (0 / 270 / 180 / 90 degrees), so every player's discards read the
         way that player threw them, exactly as on a physical table. -->
    <!-- The ring of ponds. Its three columns hug their content and the whole grid
         is centred, so the four ponds sit close around the middle the way they do
         on a table; with a stretched middle column the side ponds drifted out to
         the edges of the screen and left the felt empty. -->
    <div id="ring">
      <div class="pond-slot slot-across">
        <div class="pond-label" id="label-across"></div>
        <div id="pond-across" class="pond-frame"><div class="pond-grid"></div></div>
      </div>
      <!-- The side players' concealed hands sit inside the ring, right beside
           their own discards: out in the table's side columns they were stranded
           a couple of hundred pixels from the pond they belong to. -->
      <section class="seat seat-left" id="seat-left"></section>
      <div class="pond-slot slot-left">
        <div class="pond-label" id="label-left"></div>
        <div id="pond-left" class="pond-frame"><div class="pond-grid"></div></div>
      </div>
      <!-- The middle of the table: each seat's wind and points in the diamond
           around the centre panel, the way 雀魂 arranges the four player panels
           (the across player above, yours below, the side players beside). Each
           readout is `renderCentreSeats`'s (see app.js). -->
      <div id="centre-stack">
        <div class="centre-seat diamond-across" id="centre-seat-across"></div>
        <div class="centre-seat diamond-left" id="centre-seat-left"></div>
        <div id="centre-panel">
          <!-- The wall as a ring around the round: 雀魂 draws the remaining tiles
               as a dial that empties as the hand goes on, which reads at a glance
               in a way a horizontal bar never did — the bar said "somewhere
               between full and empty" without saying where. -->
          <div id="centre-dial">
            <svg viewBox="0 0 132 132" aria-hidden="true">
              <circle class="dial-track" cx="66" cy="66" r="58"></circle>
              <circle class="dial-arc" id="dial-arc" cx="66" cy="66" r="58"></circle>
            </svg>
            <div id="centre-head">
              <span id="centre-wind">东</span>
              <span id="centre-round"></span>
              <span id="centre-wall-text"></span>
            </div>
          </div>
          <div id="dora-tiles" class="tiles"></div>
          <!-- 裏ドラ, empty until a hand is won; `absorbEvents` fills it. -->
          <div id="ura-tiles" class="tiles hidden"></div>
          <div id="stick-box" class="sticks-row"></div>
        </div>
        <div class="centre-seat diamond-right" id="centre-seat-right"></div>
        <div class="centre-seat diamond-self" id="centre-seat-self"></div>
      </div>
      <div class="pond-slot slot-right">
        <div class="pond-label" id="label-right"></div>
        <div id="pond-right" class="pond-frame"><div class="pond-grid"></div></div>
      </div>
      <section class="seat seat-right" id="seat-right"></section>
      <div class="pond-slot slot-self">
        <div class="pond-label" id="label-self"></div>
        <div id="pond-self" class="pond-frame"><div class="pond-grid"></div></div>
      </div>
    </div>

    <section id="action-bar"></section>

    <section id="hand-area">
      <div id="seat-self"></div>
      <div id="melds-self" class="melds"></div>
      <div id="hand" class="tiles hand" role="group" aria-label="手牌"></div>
      <div id="hand-info">
        <span id="shanten-info"></span>
        <span id="furiten-flag" class="flag hidden">振听</span>
      </div>
    </section>

    <section id="log-strip">
      <div id="log-head">
        <span>对局记录</span>
        <!-- one line of what just happened, so the record is useful while the
             full list is collapsed -->
        <!-- The live region for screen readers: present and empty at load, one
             line per beat (never the whole growing log), polite so it waits for a
             pause. This is the line a player who cannot see the table hears. -->
        <span id="log-latest" role="status" aria-live="polite" aria-label="最新动态"></span>
        <button id="keys-btn" class="mini" title="键盘与鼠标操作">快捷键</button>
        <button id="log-toggle" class="mini">展开</button>
      </div>
      <div id="log" class="collapsed"></div>
    </section>
  </main>

  <!-- A loud, brief announcement of 立直 / 自摸 / 荣和 / 流局. It is not a
       dialog: it never takes a click, it just makes sure the player noticed. -->
  <div id="banner" class="hidden" aria-live="polite"></div>

  <div id="hint-box" class="hidden"></div>
  <div id="toast" class="hidden"></div>

  <div id="replay-overlay" class="hidden">
    <div id="replay-card">
      <div class="replay-head">
        <h2>牌谱分析</h2>
        <select id="replay-select"></select>
        <button id="replay-run">分析</button>
        <span id="replay-status" class="muted"></span>
        <button id="replay-close" style="margin-left:auto">关闭</button>
      </div>
      <div id="replay-body"></div>
    </div>
  </div>

  <div id="overlay" class="hidden">
    <div id="overlay-card">
      <h2 id="overlay-title"></h2>
      <div id="overlay-body"></div>
      <button id="overlay-close">继续</button>
    </div>
  </div>
</div>
<script src="/app.js"></script>
<script>
// If app.js itself fails to load, the static skeleton above leaves a green table
// whose buttons do nothing and which says nothing about it. Say so.
window.setTimeout(function () {
  if (!window.__mmjBooted) {
    var box = document.getElementById("conn-chip");
    if (box) {
      box.className = "";
      box.textContent = "脚本未能加载";
    }
    var table = document.getElementById("table");
    if (table) {
      var note = document.createElement("p");
      note.style.cssText = "padding:16px;color:#ffd166;font-size:14px";
      note.textContent = "前端脚本 /app.js 没有加载成功：请重新载入页面（Cmd-R）；"
        + "如果反复如此，检查服务是否在运行、以及浏览器控制台里的报错。";
      table.appendChild(note);
    }
  }
}, 2500);
</script>
</body>
</html>
